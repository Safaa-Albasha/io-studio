<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رقم كبير — موشن I/O Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
/* الهوية من .io/theme.json — بدّل هذي القيم بس */
:root{--bg:#FFF7EC;--ink:#2A2622;--accent:#E0663A;--accent2:#2F7FBF;--soft:#F3E3CF;--font:"Cairo",sans-serif;--W:1080px;--H:1920px}
*{box-sizing:border-box;margin:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden}
.el{position:absolute;will-change:transform,opacity}
#kicker{top:420px;right:140px;left:140px;font-size:50px;font-weight:800;color:var(--accent)}
#num{top:500px;right:140px;left:140px;font-size:300px;font-weight:800;line-height:1;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
#label{top:840px;right:140px;left:140px;font-size:60px;font-weight:800;line-height:1.3}
#track{top:1080px;right:140px;width:800px;height:36px;border-radius:18px;background:var(--soft)}
#fill{top:1080px;right:140px;height:36px;border-radius:18px;background:var(--accent)}
#src{top:1150px;right:140px;font-size:30px;opacity:.55}
#ring{width:900px;height:900px;border-radius:50%;border:40px solid var(--soft);top:250px;left:-420px}
</style>
</head>
<body>
<div id="stage">
<div class="el" id="ring"></div>
<div class="el" id="kicker">هالسنة</div>
<div class="el" id="num">0</div>
<div class="el" id="label">فيديو نزّلته — مثال، حط رقمك</div>
<div class="el" id="track"></div><div class="el" id="fill"></div>
<div class="el" id="src">المصدر: اكتب المصدر هنا</div>
</div>
<script>
// ── عقد الموشن: __duration بالثواني، و__seek(t) يرسم اللقطة عند t بدون مؤقتات ──
// رقم يعد من الصفر للقيمة، وشريط يمتلي، ومصدر صغير تحت. غيّر VALUE و SUFFIX والنصوص.
window.__duration = 6;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, d) => clamp((t - a) / d);                       // تقدّم 0→1
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const outElastic = (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1);
const lerp = (a, b, k) => a + (b - a) * k;
function rise(el, k, dist) { el.style.opacity = k; el.style.transform = `translateY(${(1 - outCubic(k)) * (dist || 60)}px)`; }
function pop(el, k) { el.style.opacity = clamp(k * 2); el.style.transform = `scale(${k ? outBack(k) : 0})`; }
function fmt(n, dec) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
/** يقسم نص العنصر لكلمات <span> حتى تتحرك كلمة كلمة. */
function words(el) { if (!el.dataset.split) { el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(' '); el.dataset.split = 1; } return [...el.querySelectorAll('.w')]; }
const VALUE = 120, SUFFIX = '', DEC = 0, SHARE = 0.6; // ⛔ رقم حقيقي (من المستخدم أو مصدر) بس
window.__seek = function (t) {
  rise($('kicker'), p(t, 0.1, 0.4), 30);
  const k = inOut(p(t, 0.4, 1.8));
  $('num').textContent = fmt(VALUE * k, DEC) + SUFFIX;
  $('num').style.opacity = p(t, 0.3, 0.3);
  $('num').style.transform = `scale(${1 + 0.06 * Math.sin(p(t, 2.2, 0.4) * Math.PI)})`;
  rise($('label'), p(t, 1.4, 0.5), 40);
  $('track').style.opacity = p(t, 1.8, 0.3);
  $('fill').style.width = `${outCubic(p(t, 2.0, 1.2)) * 800 * SHARE}px`;
  $('src').style.opacity = p(t, 2.8, 0.4) * 0.55;
  $('ring').style.transform = `rotate(${t * 20}deg) scale(${0.9 + 0.1 * outCubic(p(t, 0, 1))})`;
  $('stage').style.opacity = 1 - p(t, window.__duration - 0.4, 0.4);
};
// المعاينة بالمتصفح: يشتغل لوحده. وضع التصدير (?render=1): الرسّام يتحكم بالوقت.
if (!/render=1/.test(location.search)) {
  const t0 = performance.now();
  (function loop(now) { window.__seek(((now - t0) / 1000) % (window.__duration + 1)); requestAnimationFrame(loop); })(t0);
} else window.__seek(0);
</script>
</body>
</html>
