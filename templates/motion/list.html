<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>موشن — I/O Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
/* الهوية من .io/theme.json */
:root{--bg:#FFF7EC;--ink:#2A2622;--accent:#E0663A;--accent2:#2F7FBF;--soft:#F3E3CF;--font:"Cairo",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
/* المسرح يقص أي عنصر يطلع برّه، حتى ما تنزاح الصفحة بالـRTL */
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* كل العناصر موضعها مطلق — والحركة كلها من __seek(t) */
.el{position:absolute;will-change:transform,opacity}
#kicker{top:300px;right:140px;left:140px;font-size:46px;font-weight:800;color:var(--accent)}
#title{top:380px;right:140px;left:140px;font-size:120px;line-height:1.15;font-weight:800}
#title span{display:inline-block}
#bar{top:760px;right:140px;height:16px;border-radius:8px;background:var(--accent)}
.point{right:140px;left:140px;font-size:62px;font-weight:800;display:flex;gap:28px;align-items:center}
.point b{width:96px;height:96px;border-radius:28px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:54px;flex:0 0 auto;direction:ltr}
#p1{top:850px}#p2{top:1000px}#p3{top:1150px}
#cta{top:1300px;right:140px;font-size:54px;font-weight:800;background:var(--accent);color:#fff;padding:18px 44px;border-radius:999px}
#handle{top:1380px;left:140px;font-size:34px;font-weight:800;direction:ltr;opacity:.6}
#blob{width:700px;height:700px;border-radius:50%;background:var(--soft);top:-200px;left:-260px}
</style>
</head>
<body>
<div id="stage">
<div class="el" id="blob"></div>
<div class="el" id="kicker">3 أشياء</div>
<div class="el" id="title"><span>تخلي</span> <span>الفيديو</span> <span>ينحفظ</span></div>
<div class="el" id="bar"></div>
<div class="el point" id="p1"><b>1</b>هوك بأول ثانيتين</div>
<div class="el point" id="p2"><b>2</b>نص على الشاشة</div>
<div class="el point" id="p3"><b>3</b>نهاية تفتح سؤال</div>
<div class="el" id="cta">احفظه 🔖</div>
<div class="el" id="handle">@حسابك</div>
</div>
<script>
// ── عقد الموشن: __duration بالثواني، و__seek(t) يرسم اللقطة عند t بدون مؤقتات ──
window.__duration = 7;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, d) => clamp((t - a) / d);                 // تقدّم من 0 إلى 1
const outBack = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
function rise(el, k, dist) { el.style.opacity = k; el.style.transform = `translateY(${(1 - outCubic(k)) * (dist || 60)}px)`; }
function pop(el, k) { el.style.opacity = clamp(k * 2); el.style.transform = `scale(${k ? outBack(k) : 0})`; }

window.__seek = function (t) {
  $('blob').style.transform = `translate(${Math.sin(t * 0.8) * 30}px, ${Math.cos(t * 0.6) * 30}px) scale(${1 + 0.04 * Math.sin(t)})`;
  rise($('kicker'), p(t, 0.1, 0.4), 30);
  [...$('title').children].forEach((s, i) => rise(s, p(t, 0.3 + i * 0.18, 0.45), 80));
  $('bar').style.width = `${outCubic(p(t, 1.0, 0.6)) * 360}px`;
  ['p1', 'p2', 'p3'].forEach((id, i) => rise($(id), p(t, 1.6 + i * 0.7, 0.5), 50));
  pop($('cta'), p(t, 4.2, 0.5));
  $('handle').style.opacity = p(t, 4.6, 0.4) * 0.6;
  // خروج ناعم بآخر نص ثانية
  $('stage').style.opacity = 1 - p(t, window.__duration - 0.5, 0.5);
};
// المعاينة بالمتصفح: يشتغل لوحده. وضع التصدير (?render=1): الرسّام يتحكم بالوقت.
if (!/render=1/.test(location.search)) {
  const t0 = performance.now();
  (function loop(now) { window.__seek(((now - t0) / 1000) % (window.__duration + 1)); requestAnimationFrame(loop); })(t0);
} else window.__seek(0);
</script>
</body>
</html>
