<style>

<canvas id="c" width="1080" height="1920"></canvas>
<script>

    const name = (i, a, b, dy) => { if (a < 0.01) return; X.save(); X.globalAlpha *= a; if (b > 0.3) X.filter = `blur(${b}px)`; txt('MODEL · 0' + (i + 1), 540, 880 + dy, 22, { color: C.mut, ls: 6, w: 600 }); txt(c.tabs[i], 540, 1010 + dy, 110, { w: 900 }); X.restore(); };

    c.rows.forEach((r, i) => { const a = P(t, S.t0 + 0.2 + i * 0.12, 0.42), y = 830 + i * 150, hi = i === c.pick && t > S.t0 + 1.75; X.save(); X.globalAlpha *= a; if (a < 0.98) X.filter = `blur(${16 * (1 - a)}px)`; X.translate(0, 34 * (1 - a));
