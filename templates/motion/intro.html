<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>انترو بالحساب — موشن I/O Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
/* الهوية من .io/theme.json — بدّل هذي القيم بس */
:root{--bg:#FFF7EC;--ink:#2A2622;--accent:#E0663A;--accent2:#2F7FBF;--soft:#F3E3CF;--font:"Cairo",sans-serif;--W:1080px;--H:1920px}
*{box-sizing:border-box;margin:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden}
.el{position:absolute;will-change:transform,opacity}
.ring{border-radius:50%;border:24px solid var(--accent);top:960px;left:540px;width:0;height:0}
#r2{border-color:var(--accent2)}#r3{border-color:var(--soft)}
#logo{width:300px;height:300px;border-radius:90px;background:var(--accent);color:#fff;top:810px;left:390px;display:grid;place-items:center;font-size:190px;font-weight:800}
#name{top:1150px;right:0;left:0;text-align:center;font-size:80px;font-weight:800}
#handle{top:1260px;right:0;left:0;text-align:center;font-size:44px;font-weight:800;direction:ltr;color:var(--accent)}
</style>
</head>
<body>
<div id="stage">
<div class="el ring" id="r1"></div><div class="el ring" id="r2"></div><div class="el ring" id="r3"></div>
<div class="el" id="logo">أ</div>
<div class="el" id="name">اسمك هنا</div>
<div class="el" id="handle">@حسابك</div>
</div>
<script>
// ── عقد الموشن: __duration بالثواني، و__seek(t) يرسم اللقطة عند t بدون مؤقتات ──
// دوائر تنفجر، الشعار/الحرف بالوسط، والحساب يطلع. 3–4 ثواني لبداية أو نهاية أي فيديو.
window.__duration = 4;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, d) => clamp((t - a) / d);                       // تقدّم 0→1
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const outElastic = (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1);
const lerp = (a, b, k) => a + (b - a) * k;
function rise(el, k, dist) { el.style.opacity = k; el.style.transform = `translateY(${(1 - outCubic(k)) * (dist || 60)}px)`; }
function pop(el, k) { el.style.opacity = clamp(k * 2); el.style.transform = `scale(${k ? outBack(k) : 0})`; }
function fmt(n, dec) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
/** يقسم نص العنصر لكلمات <span> حتى تتحرك كلمة كلمة. */
function words(el) { if (!el.dataset.split) { el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(' '); el.dataset.split = 1; } return [...el.querySelectorAll('.w')]; }
window.__seek = function (t) {
  ['r1', 'r2', 'r3'].forEach((id, i) => {
    const k = outCubic(p(t, 0.1 + i * 0.12, 1.1)), d = 1400 * k;
    const el = $(id); el.style.width = el.style.height = d + 'px'; el.style.transform = `translate(${-d / 2}px, ${-d / 2}px)`;
    el.style.opacity = 1 - k; el.style.borderWidth = (24 * (1 - k) + 2) + 'px';
  });
  const k = p(t, 0.25, 0.7);
  $('logo').style.opacity = clamp(k * 3);
  $('logo').style.transform = `scale(${outElastic(k)}) rotate(${(1 - outCubic(k)) * -90}deg)`;
  const ls = words($('name'));
  ls.forEach((w, i) => { const q = p(t, 0.9 + i * 0.15, 0.4); w.style.display = 'inline-block'; w.style.opacity = q; w.style.transform = `translateY(${(1 - outBack(q)) * 50}px)`; });
  rise($('handle'), p(t, 1.4, 0.4), 20);
  $('stage').style.opacity = 1 - p(t, window.__duration - 0.4, 0.4);
};
// المعاينة بالمتصفح: يشتغل لوحده. وضع التصدير (?render=1): الرسّام يتحكم بالوقت.
if (!/render=1/.test(location.search)) {
  const t0 = performance.now();
  (function loop(now) { window.__seek(((now - t0) / 1000) % (window.__duration + 1)); requestAnimationFrame(loop); })(t0);
} else window.__seek(0);
</script>
</body>
</html>
