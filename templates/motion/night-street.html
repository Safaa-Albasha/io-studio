<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شارع بالليل — موشن I/O Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<style>
/* الهوية من .io/theme.json — بدّل هذي القيم بس */
:root{--bg:#0B0D11;--ink:#F5F6F8;--accent:#4FB3FF;--mut:#8A8F99;--font:"Cairo",sans-serif;--W:1080px;--H:1920px}
*{margin:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg)}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ═══ قالب «شارع بالليل» (I/O Studio) — قصة محل أو مشروع: خريطة مدينة بالليل مايلة (2.5D) ودبوسين، الكاميرا تغطس بالدبوس الثاني،
   تطلع واجهة المحل، وجوال يطلع قدامها بمحادثة، وبالآخر ترجع للخريطة. لقطة وحدة بلا قص حاد.
   ⭐ طبقات اختيارية (صورك أو مولّدة بأداة صور): حط جنب الملف map.jpg (خريطة من فوق، أي مقاس) و shop.jpg (واجهة المحل عمودية).
      ما موجودة؟ ترسم بالكود (بلوكات وشبابيك مضوية وشارع يلمع، وواجهة بمظلة وشباك مضوي).
   عدّل CONFIG بس. *كلمة* بالعناوين = كبسولة اللون المميز. */
const CONFIG = {
  pins: [{ label: 'سوّى نظام معقّد', sub: 'COMPLEX' }, { label: 'رد تلقائي بسيط', sub: 'SIMPLE' }],
  shop: 'الزاوية',
  chat: [['me', 'عندكم توصيل؟'], ['bot', 'إي، لحد الساعة 10 بالليل ✓'], ['me', 'زين، أريد طلب'], ['bot', 'هذا رابط القائمة ↗']],
  chatTitle: 'SHOP B · CHAT', chatNote: 'AUTO-REPLY · مثال',
  beats: [[0, 2.1, 'شارع واحد', 'نفس *الشارع*'], [2.3, 4.1, 'محلّين', 'ونفس *السؤال*'], [4.4, 6.3, 'المحل الثاني', 'ما سوّى *نظام*'], [6.6, 8.2, 'رد تلقائي بسيط', '*وكفّى*'], [8.4, 99, 'مو كل شي', 'يحتاج *نظام*']],
  duration: 9.8,
};
window.__duration = CONFIG.duration;
const X = document.getElementById('c').getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { bg: css('--bg'), ink: css('--ink'), acc: css('--accent'), mut: css('--mut'), font: css('--font') };
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), L = (a, b, k) => a + (b - a) * k;
const oc = x => 1 - Math.pow(1 - x, 3), ic = x => x * x * x, ioc = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), ob = x => 1 + 3 * Math.pow(x - 1, 3) + 2 * Math.pow(x - 1, 2);
const P = (t, a, d, e) => (e || oc)(cl((t - a) / d));
const rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const A = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; }, mix = (a, b, k) => '#' + rgb(a).map((v, i) => Math.round(L(v, rgb(b)[i], k)).toString(16).padStart(2, '0')).join('');
const lum = h => { const [r, g, b] = rgb(h); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const NIGHT = lum(C.bg) < 110 ? C.bg : mix(C.ink, '#000', 0.3), INK = lum(C.ink) > lum(C.bg) ? C.ink : C.bg;   // الشارع ليلي دايماً: الأغمق أرضية والأفتح نص
const SURF = mix(NIGHT, INK, 0.08), LINE = mix(NIGHT, INK, 0.18), SOFT = mix(NIGHT, INK, 0.7), ON = lum(C.acc) > 150 ? mix(NIGHT, '#000', 0.2) : '#fff';
const h2 = (a, b) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const F = (w, s) => `${w} ${s}px ${C.font}`;
function txt(s, x, y, size, o = {}) { X.save(); X.font = F(o.w || 700, size); X.direction = /[؀-ۿ]/.test(s) ? 'rtl' : 'ltr'; X.textAlign = o.align || 'center'; X.fillStyle = o.color || INK; if (o.ls) X.letterSpacing = o.ls + 'px'; X.fillText(s, x, y); X.restore(); }
const tw = (s, size, w) => { X.save(); X.font = F(w || 700, size); const v = X.measureText(s).width; X.restore(); return v; };
const rr = (Y, x, y, w, h, r) => { Y.beginPath(); Y.roundRect(x, y, w, h, r); };
const path = (t, K) => { if (t <= K[0][0]) return K[0].slice(1); for (let i = 0; i < K.length - 1; i++) { const [a, ...Av] = K[i], [b, ...Bv] = K[i + 1]; if (t < b) { const p = ioc((t - a) / (b - a)); return Av.map((v, j) => L(v, Bv[j], p)); } } return K[K.length - 1].slice(1); };
// الطبقات الاختيارية
const IMG = {}; ['map', 'shop'].forEach(n => { const im = new Image(); im.onload = () => { IMG[n] = im; }; im.src = n + '.jpg'; });
// الخريطة (عالم 2000×2600) — مرسومة مرة وحدة
const MAP = document.createElement('canvas'); MAP.width = 2000; MAP.height = 2600;
(() => { const c = MAP.getContext('2d'); c.fillStyle = mix(NIGHT, '#000', 0.4); c.fillRect(0, 0, 2000, 2600); let k = 0;
  for (let gx = 0; gx < 2000; gx += 150) for (let gy = 0; gy < 2600; gy += 150) { k++; if (Math.abs(gx + 75 - 1000) < 120) continue; const w = 110 + h2(k, 1) * 30, h = 110 + h2(k, 2) * 30, dp = 12 + h2(k, 3) * 22;
    c.fillStyle = mix(NIGHT, '#000', 0.6); c.fillRect(gx + 20, gy + 20 + dp, w, h); c.fillStyle = mix(NIGHT, INK, 0.06 + h2(k, 4) * 0.05); c.fillRect(gx + 20, gy + 20, w, h);
    for (let q = 0; q < 5; q++) if (h2(k, 10 + q) < 0.55) { c.fillStyle = h2(k, 20 + q) < 0.25 ? A(C.acc, 0.85) : A(INK, 0.35); c.fillRect(gx + 30 + h2(k, 30 + q) * (w - 26), gy + 30 + h2(k, 40 + q) * (h - 26), 9, 9); } }
  const g = c.createLinearGradient(880, 0, 1120, 0); g.addColorStop(0, A(C.acc, 0)); g.addColorStop(0.5, A(C.acc, 0.35)); g.addColorStop(1, A(C.acc, 0)); c.fillStyle = g; c.fillRect(880, 0, 240, 2600); c.fillStyle = A(INK, 0.85); c.fillRect(996, 0, 8, 2600); })();
const PINS = [[900, 1160], [1180, 1420]];
// خريطة مايلة: شرائح أفقية، البعيد يصغر (منظور بسيط)
function drawMap(cx, cy, z, tilt, blur) { const src = IMG.map || MAP, sx = src.width / 2000, sy = src.height / 2600; X.save(); X.fillStyle = mix(NIGHT, '#000', 0.4); X.fillRect(0, 0, 1080, 1920); if (blur > 0.3) X.filter = `blur(${blur}px)`;
  const ct = Math.cos(tilt * Math.PI / 180), N = 90, H0 = 2600;
  for (let i = 0; i < N; i++) { const wy0 = i * H0 / N, wy1 = (i + 1) * H0 / N, d0 = 1 + (cy - wy0) * 0.00045 * Math.sin(tilt * Math.PI / 180), d1 = 1 + (cy - wy1) * 0.00045 * Math.sin(tilt * Math.PI / 180);
    const s0 = z / Math.max(0.3, d0), s1 = z / Math.max(0.3, d1), y0 = 960 + (wy0 - cy) * z * ct / Math.max(0.3, d0), y1 = 960 + (wy1 - cy) * z * ct / Math.max(0.3, d1); if (y1 < -50 || y0 > 1970) continue;
    const s = (s0 + s1) / 2; X.drawImage(src, 0, wy0 * sy, src.width, (wy1 - wy0) * sy + 1, 540 - cx * s, y0, 2000 * s, y1 - y0 + 1); }
  X.restore(); const proj = (wx, wy) => { const d = 1 + (cy - wy) * 0.00045 * Math.sin(tilt * Math.PI / 180), s = z / Math.max(0.3, d); return [540 + (wx - cx) * s, 960 + (wy - cy) * z * ct / Math.max(0.3, d), s]; }; return proj; }
function pin(x, y, s, k, kl, i) { if (k <= 0.01) return; const b = i === 1; X.save(); X.translate(x, y); X.scale(s * k, s * k); X.globalAlpha *= cl(k * 3);
  X.save(); X.rotate(-Math.PI / 4); X.fillStyle = b ? C.acc : mix(NIGHT, INK, 0.2); rr(X, -46, -46, 92, 92, [46, 46, 46, 0]); X.fill(); X.restore();
  txt(b ? 'B' : 'A', 0, 14, 40, { w: 900, color: b ? ON : SOFT });
  if (kl > 0.01) { X.globalAlpha *= kl; const lb = CONFIG.pins[i], w = Math.max(tw(lb.label, 28, 600), 160) + 40; X.fillStyle = SURF; rr(X, -w / 2, -170, w, 92, 16); X.fill(); X.lineWidth = 1.5; X.strokeStyle = b ? C.acc : LINE; X.stroke(); txt(lb.label, 0, -128, 28, { w: 600 }); txt(lb.sub, 0, -96, 18, { color: C.mut, ls: 3, w: 600 }); }
  X.restore(); }
function shop(t) { if (IMG.shop) { const im = IMG.shop, s = Math.max(1080 / im.width, 1920 / im.height); X.drawImage(im, 540 - im.width * s / 2, 960 - im.height * s / 2, im.width * s, im.height * s); return; }
  X.fillStyle = mix(NIGHT, '#000', 0.2); X.fillRect(0, 0, 1080, 1920); X.fillStyle = mix(NIGHT, INK, 0.06); X.fillRect(80, 380, 920, 1180);
  for (let i = 0; i < 8; i++) { X.fillStyle = i % 2 ? INK : C.acc; X.beginPath(); X.moveTo(80 + i * 115, 700); X.lineTo(195 + i * 115, 700); X.lineTo(185 + i * 115, 820); X.lineTo(90 + i * 115, 820); X.fill(); }
  const g = X.createLinearGradient(0, 840, 0, 1400); g.addColorStop(0, A(C.acc, 0.55)); g.addColorStop(1, A(C.acc, 0.15)); X.fillStyle = g; X.fillRect(150, 850, 600, 520);
  X.fillStyle = NIGHT; for (let i = 0; i < 6; i++) { const x = 200 + i * 95, y = 1160 + Math.sin(t * 2 + i) * 4; X.beginPath(); X.arc(x, y, 32, 0, 7); X.fill(); X.fillRect(x - 42, y + 30, 84, 160); }
  X.fillStyle = mix(NIGHT, INK, 0.12); X.fillRect(790, 880, 160, 480); X.fillStyle = C.acc; X.fillRect(915, 1110, 12, 40);
  txt(CONFIG.shop, 540, 630, 92, { w: 900 }); X.fillStyle = mix(NIGHT, '#000', 0.5); for (let i = 0; i < 9; i++) { const x = 40 + i * 125; X.beginPath(); X.arc(x, 1700, 62, 0, 7); X.fill(); X.fillRect(x - 80, 1750, 160, 200); } }
function phone(t, k) { if (k <= 0.01) return; X.save(); X.globalAlpha *= k; X.translate(0, L(500, 0, P(t, 6.2, 0.6))); X.shadowColor = 'rgba(0,0,0,.7)'; X.shadowBlur = 140; X.shadowOffsetY = 60;
  X.fillStyle = mix(NIGHT, '#000', 0.3); rr(X, 250, 560, 580, 1180, 70); X.fill(); X.shadowBlur = 0; X.lineWidth = 10; X.strokeStyle = mix(NIGHT, INK, 0.12); X.stroke();
  txt(CONFIG.chatTitle, 540, 630, 20, { color: C.mut, ls: 4, w: 600 }); txt(CONFIG.chatNote, 540, 1690, 18, { color: mix(NIGHT, INK, 0.4), ls: 3, w: 600 });
  CONFIG.chat.forEach(([who, s], i) => { const p = P(t, 6.7 + i * 0.35, 0.35, ob); if (p <= 0.01) return; const me = who === 'me', w = Math.min(420, tw(s, 30, 400) + 48), y = 700 + i * 140;
    X.save(); X.globalAlpha *= cl(p * 3); const x = me ? 800 - w : 280; X.translate(x + w / 2, y + 40 + 20 * (1 - cl(p))); X.scale(L(0.7, 1, p), L(0.7, 1, p)); X.translate(-x - w / 2, -y - 40);
    X.fillStyle = me ? mix(NIGHT, INK, 0.12) : C.acc; rr(X, x, y, w, 84, me ? [26, 26, 8, 26] : [26, 26, 26, 8]); X.fill(); txt(s, x + w / 2, y + 53, 30, { w: 400, color: me ? INK : ON }); X.restore(); });
  X.restore(); }
function head(t) { const hb = CONFIG.beats.find(h => t >= h[0] - 0.1 && t < h[1] + 0.35) || CONFIG.beats[0];
  const e = (a, z, din) => { const pi = P(t, a, din || 0.45), po = P(t, z, 0.28, ic); return [pi * (1 - po), 18 * (1 - pi) + 16 * po, 18 * (1 - pi)]; };
  const draw = (k, fn) => { const [o, b, dy] = k; if (o <= 0.01) return; X.save(); X.globalAlpha *= o; if (b > 0.3) X.filter = `blur(${b}px)`; X.translate(0, dy); fn(); X.restore(); };
  draw(e(hb[0] ? hb[0] : -1, hb[1]), () => txt(hb[2], 540, 262, 44, { w: 400, color: SOFT }));
  draw(e(hb[0] ? hb[0] + 0.08 : -1, hb[1] + 0.03, 0.5), () => { const ws = hb[3].split(/\s+/), size = 92, sp = tw(' ', size, 900), pad = 26, W = ws.map(w => tw(w.replace(/\*/g, ''), size, 900)), cap = ws.map(w => /\*/.test(w));
    let x = 540 + (W.reduce((a, b) => a + b, 0) + sp * (ws.length - 1) + cap.filter(Boolean).length * pad * 2) / 2;
    ws.forEach((w, i) => { if (cap[i]) x -= pad; const r = x, l = x - W[i]; if (cap[i]) { X.fillStyle = C.acc; rr(X, l - pad, 330, W[i] + pad * 2, 112, 22); X.fill(); } txt(w.replace(/\*/g, ''), (l + r) / 2, 412, size, { w: 900, color: cap[i] ? ON : INK }); x = l - sp - (cap[i] ? pad : 0); }); }); }
// كاميرا واحدة على الخريطة: [t, cx, cy, zoom, tilt]
const CAM = [[0, 1000, 1500, 0.75, 38], [2.2, 1000, 1350, 0.95, 34], [3.4, 1180, 1420, 1.5, 26], [4.3, 1180, 1430, 4.2, 10]];
window.__seek = t => { let [cx, cy, z, tl] = path(t, CAM), bl = t > 3.9 ? 12 * P(t, 3.9, 0.4) : 0;
  if (t > 8.3) { const q = P(t, 8.3, 0.8, ioc); cx = L(1180, 1000, q); cy = L(1430, 1400, q); tl = L(10, 34, q); z = L(4.2, 0.85, q); bl = 12 * (1 - q); }
  const proj = drawMap(cx, cy, z, tl, bl);
  if (t < 4.6 || t > 8.4) PINS.forEach(([wx, wy], i) => { const a = 2.5 + i * 0.25, [x, y, s] = proj(wx, wy); pin(x, y, Math.min(1.4, s * 1.1), P(t, a, 0.4, ob), P(t, a + 0.25, 0.3), i); });
  const sh = P(t, 4.05, 0.45), so = P(t, 6.3, 0.4, ic), out = t > 8.3 ? 1 - P(t, 8.3, 0.4) : 1;
  if (sh * out > 0.01) { X.save(); X.globalAlpha *= sh * out; const s = L(1.6, 1, sh) * L(1, 1.08, so), b = 14 * (1 - sh) + 6 * so; if (b > 0.3) X.filter = `blur(${b}px)`; X.translate(540, 960); X.scale(s, s); X.translate(-540, -960); shop(t); X.restore(); }
  phone(t, P(t, 6.2, 0.4) * (1 - P(t, 8.3, 0.4, ic))); head(t); };
if (!/render=1/.test(location.search)) { const t0 = performance.now(); (function loop(now) { window.__seek(((now - t0) / 1000) % (window.__duration + 1)); requestAnimationFrame(loop); })(t0); } else window.__seek(0);
</script>
</body>
</html>
