<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قبل وبعد — موشن I/O Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
/* الهوية من .io/theme.json — بدّل هذي القيم بس */
:root{--bg:#FFF7EC;--ink:#2A2622;--accent:#E0663A;--accent2:#2F7FBF;--soft:#F3E3CF;--font:"Cairo",sans-serif;--W:1080px;--H:1920px}
*{box-sizing:border-box;margin:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
#stage{position:relative;width:var(--W);height:var(--H);overflow:hidden}
.el{position:absolute;will-change:transform,opacity}
.pane{top:0;right:0;width:var(--W);height:var(--H);background:center/cover no-repeat}
#before{background-color:#C9C2B8;background-image:url('before.jpg')}
#after{background-color:var(--soft);background-image:url('after.jpg')}
.tag{top:320px;font-size:54px;font-weight:800;padding:14px 40px;border-radius:999px}
#tb{left:140px;background:var(--ink);color:var(--bg)}
#ta{right:140px;background:var(--accent);color:#fff}
#wipe{top:0;width:14px;height:var(--H);background:#fff;box-shadow:0 0 30px rgba(0,0,0,.3)}
#knob{width:110px;height:110px;border-radius:50%;background:#fff;top:905px;display:grid;place-items:center;font-size:50px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#cap{bottom:520px;right:140px;left:140px;font-size:72px;font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="stage">
<div class="el pane" id="before"></div>
<div class="el pane" id="after"></div>
<div class="el tag" id="tb">قبل</div><div class="el tag" id="ta">بعد</div>
<div class="el" id="wipe"></div><div class="el" id="knob">⇆</div>
<div class="el" id="cap">نفس الصورة — بس بإضاءة صح</div>
</div>
<script>
// ── عقد الموشن: __duration بالثواني، و__seek(t) يرسم اللقطة عند t بدون مؤقتات ──
// شاشتين (قبل/بعد) وخط يمسح بينهم. حط صورتين before.jpg و after.jpg جنب الملف، أو خلّي الألوان.
window.__duration = 6;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, d) => clamp((t - a) / d);                       // تقدّم 0→1
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const outElastic = (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1);
const lerp = (a, b, k) => a + (b - a) * k;
function rise(el, k, dist) { el.style.opacity = k; el.style.transform = `translateY(${(1 - outCubic(k)) * (dist || 60)}px)`; }
function pop(el, k) { el.style.opacity = clamp(k * 2); el.style.transform = `scale(${k ? outBack(k) : 0})`; }
function fmt(n, dec) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
/** يقسم نص العنصر لكلمات <span> حتى تتحرك كلمة كلمة. */
function words(el) { if (!el.dataset.split) { el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(' '); el.dataset.split = 1; } return [...el.querySelectorAll('.w')]; }
window.__seek = function (t) {
  // الخط يمشي من اليسار لليمين، يرجع شوي، ويكمل (إحساس يدوي)
  const a = inOut(p(t, 0.6, 1.4)), b = inOut(p(t, 2.4, 0.8));
  const x = 1080 * (0.1 + 0.55 * a - 0.15 * b + 0.5 * inOut(p(t, 3.4, 0.9)));
  const pos = clamp(x, 0, 1080);
  $('after').style.clipPath = `inset(0 0 0 ${pos}px)`;
  $('wipe').style.left = (pos - 7) + 'px'; $('knob').style.left = (pos - 55) + 'px';
  $('wipe').style.opacity = $('knob').style.opacity = p(t, 0.3, 0.3) * (1 - p(t, 4.4, 0.3));
  pop($('tb'), p(t, 0.2, 0.4)); pop($('ta'), p(t, 0.5, 0.4));
  rise($('cap'), p(t, 4.5, 0.5), 40);
  $('stage').style.opacity = 1 - p(t, window.__duration - 0.4, 0.4);
};
// المعاينة بالمتصفح: يشتغل لوحده. وضع التصدير (?render=1): الرسّام يتحكم بالوقت.
if (!/render=1/.test(location.search)) {
  const t0 = performance.now();
  (function loop(now) { window.__seek(((now - t0) / 1000) % (window.__duration + 1)); requestAnimationFrame(loop); })(t0);
} else window.__seek(0);
</script>
</body>
</html>
