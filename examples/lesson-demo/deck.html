<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>درس تجريبي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
body{margin:0;background:#2A2622;font-family:Cairo,sans-serif}
.slide{width:1920px;height:1080px;background:#FFF7EC;color:#2A2622;display:flex;flex-direction:column;justify-content:center;padding:0 160px;box-sizing:border-box;margin:0 auto 40px;position:relative}
.slide h1{font-size:120px;margin:0 0 30px;font-weight:800}
.slide p{font-size:56px;margin:0;color:#6f665d}
.slide .big{font-size:400px;color:#E0663A;font-weight:800;line-height:1}
.slide .tag{position:absolute;top:60px;left:80px;font-size:34px;color:#E0663A;direction:ltr}
</style>
</head>
<body>
<section class="slide"><span class="tag">@حسابك</span><h1>حرف الباء</h1><p>درس قصير للأطفال — ٣ دقائق</p></section>
<section class="slide"><span class="tag">@حسابك</span><div class="big">ب</div><p>نقطة وحدة تحت</p></section>
<section class="slide"><span class="tag">@حسابك</span><h1>بطّة · باب · بيت</h1><p>كلمات تبدي بحرف الباء</p></section>
</body>
</html>
