<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنستقرام — I/O Studio</title>
<link rel="icon" href="lib/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="lib/brand.css">
<script src="lib/ls-migrate.js"></script>
<style>
/* I/O Studio's Instagram page: a familiar profile/reels/insights layout, painted with I/O Studio's own
   sky + charcoal tokens (lib/brand.css). Generic stroke icons only — no platform logo or gradient. */
:root{--ring:conic-gradient(from 200deg,var(--accent),var(--accent-strong),var(--sky-soft-ink),var(--accent));--tile-gap:2px;--col:600px}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button{font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.xs{width:13px;height:13px;stroke-width:2.2}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.shell{display:flex;justify-content:center;gap:28px;padding:0 0 60px;max-width:1240px;margin:0 auto;align-items:flex-start}
.col{width:100%;max-width:var(--col);min-width:0}
.side{display:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .sf-mark{width:32px;height:32px;border-radius:10px}
.topbar .who{font-weight:800;font-size:18px;direction:ltr;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .grow{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:none;color:var(--ink);text-decoration:none}
.iconbtn:hover{background:var(--card-2)}

.banner{margin:10px 16px 0;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;background:var(--card);display:flex;gap:8px;align-items:flex-start}
.banner.demo{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.banner b{white-space:nowrap}
.banner code{direction:ltr;unicode-bidi:isolate;background:var(--card-2);border-radius:6px;padding:0 6px;font-size:12px}

/* profile header */
.profile{padding:16px 16px 6px}
.prow{display:flex;align-items:center;gap:22px}
.avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:var(--ring);flex:none}
.avatar>div{width:100%;height:100%;border-radius:50%;border:3px solid var(--page);background:var(--sky-soft);display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--sky-soft-ink);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.counts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.counts b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.counts span{font-size:13px;color:var(--ink-2)}
.pname{font-weight:800;margin-top:10px;font-size:15px}
.pniche{color:var(--muted);font-size:13px}
.pbio{white-space:pre-line;font-size:14px;margin-top:2px}
.syncline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap;background:var(--card)}
.chip.live{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));color:var(--ok)}
.chip.manual{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent)}
.chip.demo{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));color:var(--warn)}
.pbtns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:10px;border:0;background:var(--card-2);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;padding:0 12px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.flex0{flex:none}
.qline{font-size:12.5px;color:var(--sky-soft-ink);margin-top:6px;min-height:0}

/* highlights = KPI rings */
.hl{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.hl::-webkit-scrollbar{display:none}
.hlb{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:70px;scroll-snap-align:start}
.hlb .rg{position:relative;width:66px;height:66px}
.hlb svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.hlb .in{position:absolute;inset:6px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:0;line-height:1.05}
.hlb .in .ic{width:16px;height:16px;color:var(--ink-2)}
.hlb .in b{font-size:12.5px;font-weight:800}
.hlb .lb{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.hlb .tr{font-size:10.5px;line-height:1}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);position:sticky;top:58px;z-index:15;background:var(--page)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;background:none;border:0;border-bottom:1.5px solid transparent;color:var(--muted);font-size:13px;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .t{display:none}
.panel[hidden]{display:none}

/* sort bar */
.sortbar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;align-items:center}
.sortbar::-webkit-scrollbar{display:none}
.sortbar .lbl{font-size:12px;color:var(--muted);margin-inline-end:2px;white-space:nowrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink);font-weight:700}

/* grids */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--tile-gap)}
.tile{position:relative;display:block;border:0;padding:0;background:var(--card-2);overflow:hidden;color:#fff;aspect-ratio:9/16;text-align:start}
.grid.sq .tile{aspect-ratio:1/1}
.tile img,.tile .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover{display:flex;align-items:center;padding:12px 10px;font-weight:800;font-size:14px;line-height:1.45;color:#F4F8FB;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.cover span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.grid.sq .cover{font-size:13px}
.tile::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.tile .plays{position:absolute;left:7px;bottom:6px;z-index:2;display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;direction:ltr;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .plays .ic{width:15px;height:15px;fill:#fff;stroke:#fff}
.tile .gd{position:absolute;top:6px;right:6px;z-index:2;display:flex;align-items:center;gap:4px;background:rgba(10,14,18,.62);backdrop-filter:blur(4px);border-radius:999px;padding:1px 7px 1px 6px;font-size:11.5px;font-weight:800;direction:ltr}
.tile .gd i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile .kind{position:absolute;top:7px;left:7px;z-index:2}
.tile .kind .ic{width:17px;height:17px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .hov{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;gap:16px;font-weight:800;direction:ltr}
.tile .hov span{display:flex;align-items:center;gap:4px}
.tile .hov .ic{fill:#fff;stroke:#fff}
@media (hover:hover){.tile:hover .hov{display:flex}}
.g-strong{background:var(--ok)}.g-mid{background:var(--warn)}.g-weak{background:var(--bad)}.g-none{background:var(--muted)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .ic{width:46px;height:46px;stroke-width:1.2;color:var(--ink-2);display:block;margin:0 auto 8px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* cards (audience / analysis) */
.cards{padding:12px 12px 0;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:6px}
.card .sub{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(64px,auto) 1fr 52px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;border-radius:6px;background:var(--card-2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar .v{text-align:left;font-weight:700}
.bar .n{color:var(--muted);font-size:11.5px}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:96px;direction:ltr}
.hours i{display:block;background:var(--accent);border-radius:3px 3px 0 0;opacity:.35;min-height:3px}
.hours i.top{opacity:1}
.hlabels{display:grid;grid-template-columns:repeat(4,1fr);direction:ltr;font-size:10.5px;color:var(--muted);margin-top:4px}
.hm{display:grid;grid-template-columns:44px repeat(8,1fr);gap:3px;font-size:10.5px;align-items:center}
.hm .c{aspect-ratio:1.5/1;border-radius:4px;background:var(--card-2);display:grid;place-items:center;font-weight:700;font-size:10px}
.hm .h{color:var(--muted);text-align:center}
.hm .d{color:var(--ink-2);font-size:11px}
.hlabels span,.hm .h{direction:rtl;unicode-bidi:isolate}
.gender{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0}
.gender i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.lines li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.lines li .ic{margin-top:2px;color:var(--accent)}
.weak li .ic{color:var(--bad)}
.fix{display:block;color:var(--muted);font-size:12.5px}
.plan{display:grid;gap:10px}
.idea{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card-2)}
.idea .top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.idea .hook{font-weight:800;font-size:15.5px;line-height:1.5}
.idea .why{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.idea .row{display:flex;gap:8px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet.on{transform:none;visibility:visible}
.sheet:not(.on){visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 10px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.sheet .sh h2{margin:0;font-size:16px;flex:1;text-align:center}
.sheet .body{overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.sec h3 .grow{flex:1}
.prev{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.prev .pv{width:112px;flex:none;aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;background:var(--card-2)}
.prev .pv.sq{aspect-ratio:1/1}
.prev .pv img,.prev .pv video,.prev .pv .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prev .pv .cover{font-size:11px;padding:8px}
.playbtn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;border:0;background:rgba(10,14,18,.55);color:#fff;display:grid;place-items:center;z-index:2}
.playbtn .ic{fill:#fff;stroke:#fff;width:20px;height:20px;margin-inline-start:3px}
.prev .meta{min-width:0;flex:1}
.prev .cap{font-size:14px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prev .dt{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.acts div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:800}
.acts .ic{width:24px;height:24px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.kv>span:nth-child(odd){color:var(--ink-2)}
.kv>span:nth-child(even){font-weight:800;text-align:left}
.kv .src{font-size:10.5px;color:var(--muted);font-weight:600;margin-inline-start:4px}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.big b{font-size:30px;font-weight:800;line-height:1}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card-2);margin:8px 0 4px}
.split i{display:block;height:100%}
.wbar{position:relative;height:12px;border-radius:7px;background:var(--card-2);margin:8px 0 4px;overflow:hidden}
.wbar i{position:absolute;inset-block:0;right:0;border-radius:7px;background:var(--accent)}
.ret svg{display:block;width:100%;height:auto;direction:ltr}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.score{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.score .ring{position:relative;width:76px;height:76px;flex:none}
.score .ring svg{transform:rotate(-90deg)}
.score .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;line-height:1}
.score .ring b small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.gchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-weight:800;font-size:13px;color:#0B0F13}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reasons li{border-inline-start:3px solid var(--line);padding-inline-start:9px;font-size:14px}
.reasons li.r-bad{border-color:var(--bad)}.reasons li.r-good{border-color:var(--ok)}.reasons li.r-info{border-color:var(--line);color:var(--ink-2)}
.ev{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--ink-2);display:grid;gap:3px}
.ev li::before{content:"• ";color:var(--accent)}
.deep{background:var(--sky-soft);border-radius:14px;padding:12px;margin-top:12px}
.deep h4{margin:0 0 6px;font-size:14px;display:flex;gap:6px;align-items:center;color:var(--sky-soft-ink)}
.deep dl{margin:0;display:grid;gap:6px;font-size:14px}
.deep dt{font-size:12px;color:var(--muted);font-weight:700}
.deep dd{margin:0}
.deep ol{margin:0;padding-inline-start:20px}
.newhook{font-weight:800;font-size:15.5px;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-top:2px;background:var(--card)}
.sbtns{display:grid;gap:8px;padding:14px 16px}
.sbtns .row{display:flex;gap:8px}
.spark svg{display:block;width:100%;height:auto;direction:ltr}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--page);padding:9px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  .tabs button .t{display:inline}
  .counts b{font-size:21px}
  .avatar{width:110px;height:110px}
  .prow{gap:40px}
  :root{--tile-gap:4px}
}
@media (min-width:1100px){
  .shell{padding-top:0}
  .col{border-inline:1px solid var(--line);min-height:100vh;background:color-mix(in srgb,var(--page) 70%,var(--card))}
  .side{display:block;width:380px;flex:none;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:16px 0 40px;scrollbar-width:thin}
  .side .cards{padding:0}
  .side .shead{display:flex;align-items:center;gap:8px;margin:4px 2px 12px;font-weight:800;font-size:16px}
  .tabs [data-tab="an"]{display:none}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,94vw);max-height:88vh;border-radius:20px;border:1px solid var(--line);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>

    <symbol id="i-save" viewBox="0 0 24 24"><path d="M18.5 21 12 15.6 5.5 21V4.5A1.5 1.5 0 0 1 7 3h10a1.5 1.5 0 0 1 1.5 1.5z"/></symbol>

<script>
'use strict';
const S = window.IoStats, E = window.IoEval;
const $ = (id) => document.getElementById(id);
const STORE = 'io-dashboard-stats';        // same browser copy as dashboard.html
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* blocked */ } } };
const ST = { server: false, file: location.protocol === 'file:', demo: false, stats: null, ev: null, profile: null, status: null, queue: [], sort: LS.get('io-ig-sort') || 'date', tab: 'reels', openKey: null, ringOpen: null };
const nf = new Intl.NumberFormat('en-US');
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const GRADE = { strong: 'قوي', mid: 'متوسط', weak: 'ضعيف' };
const SRC_AR = { official: 'رسمي', manual: 'يدوي', file: 'ملف' };

const has = (v) => v !== null && v !== undefined && isFinite(v);
function num(n) {
  if (!has(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return nf.format(Math.round(n));
}
const pct = (x, d = 1) => (has(x) ? (x * 100).toFixed(d) + '%' : '—');
const secs = (s) => (has(s) ? (s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : s.toFixed(s < 10 ? 1 : 0) + 'ث') : '—');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const safeUrl = (u) => (/^https?:\/\//i.test(String(u || '')) ? String(u) : '');
const icon = (n, cls) => `<svg class="ic ${cls || ''}" data-icon="${n}"><use href="#i-${n}"/></svg>`;
const median = (a) => E.median(a);
function dateTxt(d) { if (!d) return ''; const [y, m, dd] = d.slice(0, 10).split('-').map(Number); const t = d.length > 10 && !/T00:00$/.test(d) ? ' · ' + d.slice(11, 16) : ''; return `${dd} ${MONTHS[m - 1]} ${y}${t}`; }
function ago(iso) {
  const t = Date.parse(iso || ''); if (!t) return 'ما صارت بعد';
  const m = Math.round((Date.now() - t) / 6e4);
  if (m < 2) return 'هسه'; if (m < 60) return `قبل ${m} دقيقة`; const h = Math.round(m / 60); if (h < 24) return `قبل ${h} ساعة`; const d = Math.round(h / 24); return `قبل ${d} ${d === 1 ? 'يوم' : 'أيام'}`;
}
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }
async function copyText(t, msg) { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (er) { /* ignore */ } a.remove(); } toast(msg || 'انسخ ✓'); }
/** A deterministic text cover (no thumbnail / expired CDN link): I/O Studio's charcoal + sky hues. */
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }
function coverHtml(p) {
  const h = hue(p.id || p.title), a = 186 + (h % 48), b = 200 + ((h >> 5) % 40), l = 20 + ((h >> 9) % 16), sat = 38 + ((h >> 13) % 30);
  return `<div class="cover" style="background:linear-gradient(${150 + (h % 60)}deg,hsl(${a} ${sat + 20}% ${l + 18}%),hsl(${b} ${sat}% ${l}%) 70%,#14181D)"><span>${esc(p.title || '—')}</span></div>`;
}
function thumbHtml(p) { const u = safeUrl(p.thumb); return u ? `<img class="th" loading="lazy" alt="" src="${esc(u)}" data-id="${esc(p.id)}">` : coverHtml(p); }
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('th')) { const p = postByKey('instagram-' + t.dataset.id) || { id: t.dataset.id, title: '' }; t.outerHTML = coverHtml(p); }
  if (t && t.tagName === 'IMG' && t.id === 'avImg') t.parentNode.textContent = initial();
}, true);

// ------------------------------------------------------------ data
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error((j.errors || [j.error || r.status]).join('، '));
  return j;
}
const igOf = (st) => (st && st.accounts && st.accounts.instagram) || null;
async function boot() {
  const qs = new URLSearchParams(location.search);
  let st = null;
  if (!ST.file) {
    try {
      const j = await api('/api/stats'); st = j.stats; ST.status = j.status; ST.server = true;
      try { ST.profile = await api('/api/stats/profile'); } catch (e) { ST.profile = null; }
    } catch (e) { ST.server = false; }
  }
  if (!ST.server) { try { const s = JSON.parse(LS.get(STORE) || 'null'); if (s && s.accounts) st = s; } catch (e) { /* ignore */ } }
  const ig = igOf(st);
  ST.demo = qs.get('demo') === '1' || !ig || !(ig.posts || []).length;
  if (ST.demo) { st = demoStats(); ST.profile = demoProfile(); }
  ST.stats = st;
  if (ST.server && !ST.demo) { try { ST.ev = await api('/api/stats/eval?platform=instagram'); } catch (e) { ST.ev = null; } }
  if (!ST.ev) ST.ev = E.evaluate(st, { platform: 'instagram', analyses: ST.demo ? demoAnalyses() : {} });
  renderAll();
  const open = qs.get('open'); if (open) { const p = open === 'top' ? [...reels()].sort((a, b) => (b.score || 0) - (a.score || 0))[0] : postByKey('instagram-' + open); if (p) openPost(p.key); }
  if (ST.server) { pollQueue(); setInterval(pollQueue, 6000); }
}
function posts() { return (ST.ev && ST.ev.posts || []).filter((p) => p.platform === 'instagram'); }
const isReel = (p) => p.type === 'video' || p.type === 'reel';
function reels() { return posts().filter(isReel); }
function feed() { return posts().filter((p) => !isReel(p)); }
function postByKey(k) { return posts().find((p) => p.key === k); }
function rawPost(id) { const ig = igOf(ST.stats); return ig && (ig.posts || []).find((p) => p.id === id); }
function base() { return (ST.ev && ST.ev.baseline && ST.ev.baseline.instagram) || {}; }

// ------------------------------------------------------------ render
function renderAll() { renderBanners(); renderProfile(); renderRings(); renderGrid(); renderFeed(); renderAudience(); renderAnalysis(); }
function renderBanners() {
  const b = [];
  if (ST.demo) b.push(`<div class="banner demo" role="note">${icon('spark', 'sm')}<div><b>بيانات تجريبية</b> — هذي أرقام وهمية حتى تشوف شكل الصفحة. ${ST.server ? 'اضغط «اسحب الآن» حتى يسحب Claude أرقامك من إنستقرام (Composio)، أو افتح <a href="dashboard.html">صفحة الإحصائيات</a> وأضفها يدوياً.' : 'أضف أرقامك من <a href="dashboard.html">صفحة الإحصائيات</a>.'}</div></div>`);
  if (ST.file) b.push(`<div class="banner" role="note">${icon('out', 'sm')}<div>الصفحة مفتوحة كملف — تقرا الأرقام المحفوظة بهالمتصفح بس، وما تقدر ترسل طلبات لـ Claude. شغّل <code>node engine/serve.js --open instagram.html</code> من مجلد مشروعك وافتح الرابط.</div></div>`);
  else if (!ST.server) b.push(`<div class="banner" role="note">${icon('out', 'sm')}<div>السيرفر المحلي طافي — الأرقام من هالمتصفح بس. شغّل <code>node engine/serve.js --open instagram.html</code>.</div></div>`);
  $('banners').innerHTML = b.join('');
}
function initial() { const pr = ST.profile || {}; const s = (pr.name || pr.handle || '').replace(/^@/, '').trim(); return s ? [...s][0].toUpperCase() : '؟'; }
function renderProfile() {
  const ig = igOf(ST.stats) || {}, pr = ST.profile || {};
  const handle = ig.handle || pr.handle || '@حسابك';
  $('topHandle').textContent = handle;
  const pic = safeUrl(pr.picture);
  $('avatar').innerHTML = pic ? `<img id="avImg" alt="" src="${esc(pic)}">` : esc(initial());
  $('cPosts').textContent = num(has(pr.mediaCount) ? pr.mediaCount : (ig.posts || []).length);
  $('cFollowers').textContent = num(ig.followers || pr.followers || null);
  $('cFollows').textContent = num(has(pr.follows) ? pr.follows : null);
  $('pName').textContent = pr.name || handle.replace(/^@/, '');
  $('pNiche').textContent = pr.niche || '';
  $('pBio').textContent = pr.bio || (ST.server ? 'ما فيه سطر تعريف — يطلع من ملف صانع المحتوى (.io/creator-profile.md).' : '');
  const src = ST.demo ? 'demo' : ig.sync && ig.sync.source === 'composio' ? 'live' : 'manual';
  $('srcChip').className = 'chip ' + src;
  $('srcChip').innerHTML = { demo: `${icon('spark', 'xs')} تجريبي`, live: `${icon('reach', 'xs')} رسمي · Composio`, manual: `${icon('user', 'xs')} يدوي / ملف` }[src];
  const at = ST.demo ? null : (ST.status && ST.status.instagram && ST.status.instagram.at) || (ig.sync && ig.sync.at);
  $('lastSync').textContent = ST.demo ? 'آخر مزامنة: —' : `آخر مزامنة: ${ago(at)}`;
}

// ---- KPI rings (هايلايت)
const RINGS = [
  { id: 'views', label: 'المشاهدات', icon: 'eye', v: (p) => p.metrics.views, fmt: num, rel: true, what: 'متوسط مشاهدات آخر ٦ ريلز مقارنة بالوسيط (المعتاد) لحسابك. الدائرة نص مليانة = نفس عادتك، مليانة تقريباً = ضعف عادتك.' },
  { id: 'reach', label: 'الوصول', icon: 'reach', v: (p) => p.metrics.reachRatio, fmt: (x) => pct(x, 0), target: 0.3, what: 'الوصول (حسابات فريدة شافته) مقسوم على عدد متابعينك. الهدف ٣٠٪ لكل ريل؛ فوق ١٠٠٪ يعني أكيد طلع لغير المتابعين.' },
  { id: 'er', label: 'التفاعل', icon: 'heart', v: (p) => p.metrics.er, fmt: (x) => pct(x, 1), target: 0.06, what: '(لايكات + تعليقات + مشاركات + حفظ) ÷ المشاهدات. الهدف ٦٪ للريلز.' },
  { id: 'save', label: 'الحفظ', icon: 'save', v: (p) => (has(p.metrics.saves) && p.metrics.views ? p.metrics.saves / p.metrics.views : null), fmt: (x) => pct(x, 2), target: 0.02, what: 'الحفظ ÷ المشاهدات. الحفظ يعني «هذا ينفعني» — أقوى إشارة للخوارزمية بعد المشاهدة الكاملة. الهدف ٢٪.' },

function secsH(s) { if (!has(s)) return '—'; return s >= 60 ? `<span class="num">${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}</span> د` : `<span class="num">${s.toFixed(s < 10 ? 1 : 0)}</span>ث`; }
function retentionSvg(p) {

  if (Array.isArray(p.retention) && p.retention.length >= 2) pts = p.retention.map(([x, v]) => [x, v > 1.5 ? v / 100 : v]);
  else if (has(M.hold3) && D) {

    // decay after 3 s so the area under the curve ≈ average watch ratio
    const tail = Math.max(0.02, Math.min(h3, (w - (1 + h3) / 2 * x3) / Math.max(0.05, 1 - x3)));
    const k = tail >= h3 * 0.98 ? 0.01 : Math.log(h3 / Math.max(0.01, 2 * tail - h3 * 0.6));
    pts = [[0, 1], [x3, h3]];
    for (let i = 1; i <= 12; i++) { const x = x3 + (1 - x3) * (i / 12); pts.push([x, Math.max(0.01, h3 * Math.exp(-Math.max(0.05, k) * (i / 12)))]); }
  }
  if (!pts) return '';
  const W = 320, H = 110, P = 6;
  const X = (x) => P + x * (W - 2 * P), Y = (v) => P + (1 - Math.min(1, v)) * (H - 2 * P - 12);
  const line = pts.map(([x, v]) => `${X(x).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<div class="ret"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى البقاء ${approx ? '(تقريبي)' : ''}">
    <polygon points="${X(0)},${Y(0)} ${line} ${X(1)},${Y(0)}" fill="var(--accent)" opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${has(M.hold3) && D ? `<line x1="${X(Math.min(0.5, 3 / D))}" x2="${X(Math.min(0.5, 3 / D))}" y1="${P}" y2="${H - 14}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${X(Math.min(0.5, 3 / D)) + 5}" y="${P + 11}" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(M.hold3)}%</text><text x="${X(Math.min(0.5, 3 / D)) + 5}" y="${P + 24}" font-size="10" fill="var(--muted)" >بعد ٣ث</text>` : ''}
    <text x="${P}" y="${H - 1}" font-size="10" fill="var(--muted)">0:00</text><text x="${W - P}" y="${H - 1}" font-size="10" fill="var(--muted)" text-anchor="end">${D ? secs(D) : 'النهاية'}</text></svg>
    <div class="note">${approx ? 'شكل تقريبي مرسوم من نسبة السحب ومتوسط المشاهدة — إنستقرام ما يعطي المنحنى الكامل بالـ API.' : 'منحنى البقاء الكامل.'}</div></div>`;

const QST = { pending: 'بالانتظار عند Claude', working: 'Claude يشتغل عليه', done: 'خلص ✓', error: 'ما تم' };

function metricsFor(p) {

  for (const k of ['views', 'reach', 'likes', 'comments', 'shares', 'saves', 'avgWatchSec', 'hold3', 'skipRate', 'er', 'watchRatio']) if (has(p.metrics[k])) o[k] = p.metrics[k];
  if (p.index && has(p.index.views)) o.viewsVsMedian = p.index.views;
  for (const k of Object.keys(o)) if (!has(o[k])) delete o[k];

async function enqueue(body, prompt) {
  if (ST.demo) { toast('هذي بيانات تجريبية — اسحب أرقامك الحقيقية أول'); return null; }
  if (!ST.server) { copyText(prompt, 'انسخ الطلب ✓ — الصقه بـ Claude'); return null; }
  try {
    const j = await api('/api/queue', body);
    ST.queue.push(j.item); toast('انرسل لـ Claude ✓ — يستلمه وهو شغّال');
    renderQ(); setTimeout(pollQueue, 1500);
    return j.item;
  } catch (e) { toast('ما انرسل: ' + e.message); return null; }
}
function renderQ() {
  const open = ST.queue.filter((x) => x.status === 'pending' || x.status === 'working');
  const s = ST.queue.filter((x) => x.type === 'sync-stats').slice(-1)[0];
  $('qline').innerHTML = (s && (s.status === 'pending' || s.status === 'working') ? 'السحب: ' + qState(s) + ' · ' : '') + (open.length ? `طلبات مفتوحة عند Claude: ${open.length} — ما استلمها؟ گله بالشات «شغّل الطيار الآلي».` : '');
  if (ST.openKey && $('postQ')) { const p = postByKey(ST.openKey); const q = p && ST.queue.filter((x) => x.type === 'analyze-post' && x.postId === p.id).slice(-1)[0]; $('postQ').innerHTML = q ? qState(q) : ''; }
}
async function pollQueue() {
  if (!ST.server || document.hidden) return;
  try {
    const r = await api('/api/queue');
    const was = Object.fromEntries(ST.queue.map((x) => [x.id, x.status]));
    ST.queue = (r.items || []).filter((x) => ['analyze-post', 'sync-stats', 'stats-ideas', 'script'].includes(x.type));
    const finished = ST.queue.some((x) => x.status === 'done' && was[x.id] && was[x.id] !== 'done' && ['analyze-post', 'sync-stats'].includes(x.type));
    if (finished) { toast('Claude خلّص ✓ — حدّثت الأرقام'); await reload(); }
    renderQ();
  } catch (e) { /* server went away */ }
}
async function reload() {
  try {
    const j = await api('/api/stats'); ST.status = j.status;
    const ig = igOf(j.stats);
    if (ig && (ig.posts || []).length) { ST.stats = j.stats; ST.demo = false; ST.ev = await api('/api/stats/eval?platform=instagram'); try { ST.profile = await api('/api/stats/profile'); } catch (e) { /* keep */ } }

  } catch (e) { /* ignore */ }
}
