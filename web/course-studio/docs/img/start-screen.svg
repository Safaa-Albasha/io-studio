<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">شاشة البداية في استوديو الكورسات</title><desc id="desc">1: اختر مجلدًا؛ 2: اختر الدرس والشرائح ثم «لنبدأ»؛ 3: بديل لمشاركة الشاشة دون شرائح.</desc><g font-family="Cairo, Tajawal, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif"><rect x="1" y="1" width="958" height="718" rx="22" fill="#0E1013" stroke="#2A3038" stroke-width="2" /><text x="916" y="53" font-size="28" fill="#E9EEF3" font-weight="700" text-anchor="start" direction="rtl">اختر ما ستعرضه في الدرس</text><text x="916" y="83" font-size="19" fill="#9AA6B2" font-weight="400" text-anchor="start" direction="rtl">شرائح من مجلد أو شاشتك</text><rect x="240" y="112" width="480" height="540" rx="14" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="680" y="157" font-size="30" fill="#E9EEF3" font-weight="700" text-anchor="end">استوديو الكورسات</text><text x="680" y="190" font-size="17" fill="#9AA6B2" font-weight="400" text-anchor="start" direction="rtl">صيغة التسجيل</text><rect x="286" y="169" width="119" height="30" rx="14" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="346" y="191" font-size="18" fill="#5CB8F0" font-weight="600" text-anchor="middle">MP4</text><rect x="280" y="215" width="400" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="480" y="246" font-size="21" fill="#E9EEF3" font-weight="600" text-anchor="middle" direction="rtl"><tspan font-size="0">📁</tspan><tspan aria-hidden="true">▰</tspan> اختر مجلدًا</text><circle cx="712" cy="239" r="19" fill="#5CB8F0" /><text x="712" y="246" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">1</text><text x="678" y="292" font-size="17" fill="#9AA6B2" font-weight="400" text-anchor="start" direction="rtl">الدرس</text><rect x="490" y="305" width="190" height="41" rx="14" fill="#1D2127" stroke="#2A3038" stroke-width="2" /><text x="665" y="333" font-size="19" fill="#E9EEF3" font-weight="400" text-anchor="start" direction="rtl">الدرس 1</text><text x="468" y="292" font-size="17" fill="#9AA6B2" font-weight="400" text-anchor="start" direction="rtl">الشرائح</text><rect x="280" y="305" width="190" height="41" rx="14" fill="#1D2127" stroke="#2A3038" stroke-width="2" /><text x="455" y="333" font-size="19" fill="#E9EEF3" font-weight="400" text-anchor="end">deck_frames</text><rect x="280" y="365" width="400" height="48" rx="10" fill="#5CB8F0" stroke="#5CB8F0" stroke-width="2" /><text x="480" y="396" font-size="21" fill="#0E1013" font-weight="600" text-anchor="middle" direction="rtl">▶ لنبدأ</text><circle cx="712" cy="389" r="19" fill="#5CB8F0" /><text x="712" y="396" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">2</text><text x="480" y="449" font-size="18" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">أو بدون شرائح</text><rect x="280" y="471" width="400" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="480" y="502" font-size="21" fill="#E9EEF3" font-weight="600" text-anchor="middle" direction="rtl"><tspan font-size="0">🖥</tspan><tspan aria-hidden="true">▣</tspan> مشاركة الشاشة</text><circle cx="712" cy="495" r="19" fill="#5CB8F0" /><text x="712" y="502" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">3</text><rect x="280" y="571" width="400" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="480" y="602" font-size="21" fill="#E9EEF3" font-weight="600" text-anchor="middle" direction="rtl"><tspan font-size="0">📖</tspan><tspan aria-hidden="true">▤</tspan> الدليل</text><text x="480" y="688" font-size="18" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">يظهر «▶ لنبدأ» بعد اختيار المجلد</text></g></svg>