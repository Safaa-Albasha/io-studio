<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" role="img" aria-labelledby="title desc"><title id="title">لوحة التحكم</title><desc id="desc">ست مجموعات في اللوحة السفلية: الملقّن والكاميرا والرسم والتسجيل والشريحة والمزيد. المجموعات مكبّرة ومرتبة في صفّين، وفي مجموعة الشريحة: ◀ للتالية على اليسار و▶ للسابقة على اليمين.</desc><g font-family="Cairo, Tajawal, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif"><rect x="0" y="0" width="960" height="605" rx="20" fill="#0E1013" stroke="#2A3038" stroke-width="2" /><text x="920" y="54" font-size="30" fill="#E9EEF3" text-anchor="start" font-weight="700" direction="rtl">لوحة التحكم</text><text x="920" y="88" font-size="20" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">الإعدادات اللازمة مجمّعة في ست مجموعات</text><circle cx="903" cy="142" r="16" fill="#5CB8F0" /><text x="903" y="148" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">1</text><text x="876" y="150" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">النص والسرعة</text><path d="M 780 162 L 780 182" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="640" y="185" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="902" y="216" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">الملقّن</text><rect x="656" y="233" width="248" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="750" y="265" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600">A−  A+</text><circle cx="603" cy="142" r="16" fill="#5CB8F0" /><text x="603" y="148" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">2</text><text x="576" y="150" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">ظهورك في الإطار</text><path d="M 480 162 L 480 182" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="340" y="185" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="602" y="216" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">الكاميرا</text><rect x="356" y="233" width="248" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="461" y="265" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">تشغيل  ▭  ◯</text><circle cx="303" cy="142" r="16" fill="#5CB8F0" /><text x="303" y="148" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">3</text><text x="276" y="150" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">الرسم على الشريحة</text><path d="M 180 162 L 180 182" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="40" y="185" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="302" y="216" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">الرسم</text><rect x="56" y="233" width="248" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="180" y="265" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600">↗    ↶    ✏️</text><circle cx="903" cy="348" r="16" fill="#5CB8F0" /><text x="903" y="354" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">4</text><text x="876" y="356" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">البدء والإيقاف</text><path d="M 780 368 L 780 388" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="640" y="391" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="902" y="422" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">التسجيل</text><rect x="656" y="439" width="248" height="48" rx="10" fill="#c0392b" stroke="#2A3038" stroke-width="2" /><text x="764" y="471" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">تسجيل</text><circle cx="603" cy="348" r="16" fill="#5CB8F0" /><text x="603" y="354" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">5</text><text x="576" y="356" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">التنقل والشاشة</text><path d="M 480 368 L 480 388" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="340" y="391" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="602" y="422" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">الشريحة</text><rect x="356" y="439" width="248" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="480" y="471" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600">◀   2 / 8   ▶</text><circle cx="303" cy="348" r="16" fill="#5CB8F0" /><text x="303" y="354" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">6</text><text x="276" y="356" font-size="19" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">إجراءات أخرى</text><path d="M 180 368 L 180 388" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="40" y="391" width="280" height="125" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="302" y="422" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">المزيد</text><rect x="56" y="439" width="248" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="200" y="471" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600">☰    ↺</text><text x="480" y="571" font-size="20" fill="#9AA6B2" text-anchor="middle" font-weight="400" direction="rtl">انقر على اسم المجموعة لطيّها أو توسيعها</text><g transform="translate(819 257)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><path d="M-7 -10 h4 v20 h-4 z M3 -10 h4 v20 h-4 z" stroke="none" /></g><g transform="translate(566 257.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-8" width="26" height="18" rx="3" fill="none" /><circle cx="0" cy="1" r="5" fill="none" /><path d="M-7 -8 v-4 h10 v4" fill="none" /></g><g transform="translate(847 463.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><circle cx="0" cy="0" r="8" stroke="none" /></g><g transform="translate(123 463.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><path d="M-10 -3 v-7 h7 M3 -10 h7 v7 M10 3 v7 H3 M-3 10 h-7 v-7" fill="none" /></g><path d="M 844 247 l 17 10 -17 10 z" fill="#E9EEF3" /><text x="433" y="506" font-size="14" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">التالية</text><text x="527" y="506" font-size="14" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">السابقة</text></g></svg>