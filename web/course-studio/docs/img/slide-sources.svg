<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">ثلاث طرق لتقديم الشرائح</title>
  <desc id="desc">الصور تعمل دون إنترنت. ملف PDF يحتاج إلى إنترنت. احفظ عرض HTML من Claude Design في ملف واحد، وسيحوّله الاستوديو إلى إطارات بنفسه. ضع المصدر الذي اخترته في مجلد الدرس واضغط «▶ لنبدأ».</desc>
  <g font-family="Cairo, Tajawal, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif">
    <rect x="1" y="1" width="958" height="578" rx="22" fill="#0E1013" stroke="#2A3038" stroke-width="2" />
    <text x="920" y="54" fill="#E9EEF3" font-size="28" font-weight="700" text-anchor="start" direction="rtl">ثلاث طرق لتقديم الشرائح</text>
    <g fill="#16191E" stroke="#2A3038" stroke-width="2">
      <rect x="640" y="94" width="280" height="288" rx="18" />
      <rect x="340" y="94" width="280" height="288" rx="18" />
      <rect x="40" y="94" width="280" height="288" rx="18" />
    </g>
    <g fill="#E9EEF3" font-size="25" font-weight="600">
      <text x="780" y="133" text-anchor="middle" direction="rtl">الصور</text>
      <text x="480" y="133" text-anchor="middle">PDF</text>
      <text x="180" y="133" text-anchor="middle" direction="rtl">عرض HTML</text>
    </g>
    
