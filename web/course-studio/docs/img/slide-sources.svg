      <text x="180" y="290" text-anchor="middle" direction="rtl">من Claude Design،</text>
      <text x="180" y="315" text-anchor="middle" direction="rtl">في ملف واحد</text>
    </g>
    <text x="180" y="353" fill="#E9EEF3" font-size="15" text-anchor="middle" direction="rtl">يحوّله الاستوديو إلى إطارات بنفسه</text>
    
