      <text x="780" y="245" text-anchor="middle">p-02.png…</text>
    </g>
    <text x="780" y="322" fill="#37d27a" font-size="19" text-anchor="middle" direction="rtl">يعمل دون إنترنت</text>
    
    <path d="M 520 160 H 467 L 440 187 V 267 H 520 Z" fill="#22272E" stroke="#5CB8F0" stroke-width="2" stroke-linejoin="round" />
    <path d="M 467 160 V 187 H 440" fill="none" stroke="#5CB8F0" stroke-width="2" stroke-linejoin="round" />
    <text x="480" y="237" fill="#5CB8F0" font-size="25" font-weight="600" text-anchor="middle">.pdf</text>
    <text x="480" y="322" fill="#9AA6B2" font-size="19" text-anchor="middle" direction="rtl">يحتاج إلى إنترنت</text>
    
    <rect x="122" y="166" width="116" height="91" rx="10" fill="#22272E" stroke="#5CB8F0" stroke-width="2" />
    <path d="M 238 189 H 122" fill="none" stroke="#5CB8F0" stroke-width="2" />
    <circle cx="226" cy="178" r="3" fill="#5CB8F0" />
    <path d="M 199 207 L 210 220 L 199 233 M 161 207 L 150 220 L 161 233 M 174 204 L 185 236" fill="none" stroke="#5CB8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
