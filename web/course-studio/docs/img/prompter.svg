<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc"><title id="title">الملقّن: اقرأ بإيقاعك</title><desc id="desc">السطر الحالي مُضاء. مسافة تشغّل النص وتوقفه، وShift مع السهمين ↑ ↓ يغيّر السرعة.</desc><g font-family="Cairo, Tajawal, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif"><rect x="0" y="0" width="960" height="526" rx="20" fill="#0E1013" stroke="#2A3038" stroke-width="2" /><text x="920" y="54" font-size="30" fill="#E9EEF3" text-anchor="start" font-weight="700" direction="rtl">الملقّن: اقرأ بإيقاعك</text><text x="920" y="88" font-size="20" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">اقرأ السطر المُضاء، والنص يتحرك وحده</text><rect x="40" y="116" width="880" height="258" rx="16" fill="#16191E" stroke="#2A3038" stroke-width="2" /><text x="786" y="170" font-size="29" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">سنتعرّف اليوم على بنية الدرس.</text><rect x="66" y="191" width="746" height="58" rx="9" fill="#15293A" stroke="#5CB8F0" stroke-width="2" /><text x="786" y="230" font-size="32" fill="#E9EEF3" text-anchor="start" font-weight="600" direction="rtl">فكرة واحدة لكل شريحة.</text><text x="786" y="289" font-size="29" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">اعرض مثالًا ثم توقّف قليلًا.</text><text x="786" y="339" font-size="29" fill="#9AA6B2" text-anchor="start" font-weight="400" direction="rtl">ثم انتقل إلى الموضوع التالي.</text><circle cx="862" cy="220" r="32" fill="#5CB8F0" /><circle cx="894" cy="421" r="16" fill="#5CB8F0" /><text x="894" y="427" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">1</text><rect x="716" y="397" width="150" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="791" y="429" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">مسافة</text><text x="695" y="429" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="400" direction="rtl">تشغيل / إيقاف مؤقت</text><circle cx="458" cy="421" r="16" fill="#5CB8F0" /><text x="458" y="427" font-size="18" fill="#0E1013" text-anchor="middle" font-weight="700">2</text><rect x="250" y="397" width="180" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="340" y="429" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600">Shift + ↑ ↓</text><text x="228" y="429" font-size="23" fill="#E9EEF3" text-anchor="start" font-weight="400" direction="rtl">السرعة</text><text x="480" y="490" font-size="20" fill="#9AA6B2" text-anchor="middle" font-weight="400" direction="rtl">ويمكنك أيضًا النقر على النص نفسه</text><g transform="translate(862.0 223.0)" fill="#0E1013" stroke="#0E1013" stroke-width="2" stroke-linejoin="round"><path d="M-7 -10 h4 v20 h-4 z M3 -10 h4 v20 h-4 z" stroke="none" /></g></g></svg>