<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">التسجيل في ثلاث خطوات</title><desc id="desc">اضغط «تسجيل»، وانتظر العدّ التنازلي 3-2-1 وسجّل الدرس. اضغط «إيقاف». انتظر حفظ الملف في مجلد الدرس أو تنزيله في المتصفح.</desc><g font-family="Cairo, Tajawal, &quot;Noto Naskh Arabic&quot;, &quot;Segoe UI&quot;, sans-serif"><rect x="1" y="1" width="958" height="518" rx="22" fill="#0E1013" stroke="#2A3038" stroke-width="2" /><text x="920" y="53" font-size="28" fill="#E9EEF3" font-weight="700" text-anchor="start" direction="rtl">من زر التسجيل إلى الفيديو الجاهز</text><rect x="660" y="108" width="260" height="284" rx="14" fill="#16191E" stroke="#2A3038" stroke-width="2" /><circle cx="890" cy="139" r="19" fill="#5CB8F0" /><text x="890" y="146" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">1</text><text x="859" y="147" font-size="23" fill="#E9EEF3" font-weight="600" text-anchor="start" direction="rtl">ابدأ</text><rect x="350" y="108" width="260" height="284" rx="14" fill="#16191E" stroke="#2A3038" stroke-width="2" /><circle cx="580" cy="139" r="19" fill="#5CB8F0" /><text x="580" y="146" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">2</text><text x="549" y="147" font-size="23" fill="#E9EEF3" font-weight="600" text-anchor="start" direction="rtl">أوقف</text><rect x="40" y="108" width="260" height="284" rx="14" fill="#16191E" stroke="#2A3038" stroke-width="2" /><circle cx="270" cy="139" r="19" fill="#5CB8F0" /><text x="270" y="146" font-size="21" fill="#0E1013" font-weight="700" text-anchor="middle">3</text><text x="239" y="147" font-size="23" fill="#E9EEF3" font-weight="600" text-anchor="start" direction="rtl">انتظر الملف</text><rect x="680" y="191" width="220" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="790" y="222" font-size="21" fill="#E9EEF3" font-weight="600" text-anchor="middle" direction="rtl"><tspan font-size="0">⏺</tspan><tspan aria-hidden="true">●</tspan> تسجيل</text><text x="790" y="299" font-size="38" fill="#c0392b" font-weight="700" text-anchor="middle">3 · 2 · 1</text><text x="790" y="346" font-size="19" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">بدأ التسجيل</text><rect x="435" y="192" width="90" height="69" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="2" /><text x="480" y="239" font-size="38" fill="#E9EEF3" font-weight="600" text-anchor="middle"><tspan font-size="0">⏹</tspan><tspan aria-hidden="true">■</tspan></text><text x="480" y="300" font-size="22" fill="#E9EEF3" font-weight="500" text-anchor="middle" direction="rtl">انتهى الدرس</text><text x="480" y="346" font-size="19" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">اضغط إيقاف</text><path d="M 220 190 H 173 L 151 212 V 275 H 220 Z" fill="#1D2127" stroke="#37d27a" stroke-width="3" /><path d="M 173 190 V 212 H 151" fill="none" stroke="#37d27a" stroke-width="3" /><text x="186" y="248" font-size="28" fill="#37d27a" font-weight="600" text-anchor="middle">▶</text><text x="170" y="304" font-size="21" fill="#E9EEF3" font-weight="600" text-anchor="middle">lecture-….mp4</text><text x="170" y="346" font-size="19" fill="#37d27a" font-weight="500" text-anchor="middle" direction="rtl">في مجلد الدرس</text><path d="M 651 245 L 622 245" fill="none" stroke="#5CB8F0" stroke-width="3" stroke-linecap="round" /><path d="M 632 238 L 622 245 L 632 252" fill="none" stroke="#5CB8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M 341 245 L 312 245" fill="none" stroke="#5CB8F0" stroke-width="3" stroke-linecap="round" /><path d="M 322 238 L 312 245 L 322 252" fill="none" stroke="#5CB8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="447" font-size="21" fill="#5CB8F0" font-weight="500" text-anchor="middle" direction="rtl">ما دام «<tspan font-size="0">⏳</tspan><tspan aria-hidden="true">◷</tspan> جارٍ الحفظ» ظاهرًا، أبقِ علامة التبويب مفتوحة</text><text x="480" y="484" font-size="19" fill="#9AA6B2" font-weight="400" text-anchor="middle" direction="rtl">إن لم تختر مجلدًا فسيُنزَّل الملف في المتصفح</text></g></svg>