t-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">التسجيل</text><path d="M 550 165 L 550 232" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="323" y="240" width="130" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="388" y="376" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">الكاميرا</text><path d="M 388 346 L 388 297" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="195" y="240" width="116" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="253" y="153" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">الشاشة</text><path d="M 253 165 L 253 232" fill="none" stroke="#5CB8F0" stroke-width="2" /><rect x="58" y="240" width="125" height="48" rx="10" fill="#22272E" stroke="#2A3038" stroke-width="2" /><text x="120.5" y="272" font-size="23" fill="#5CB8F0" text-anchor="middle" font-weight="600">⌃</text><text x="120.5" y="376" font-size="23" fill="#E9EEF3" text-anchor="middle" font-weight="600" direction="rtl">اللوحة</text><path d="M 120.5 346 L 120.5 297" fill="none" stroke="#5CB8F0" stroke-width="2" /><text x="480" y="440" font-size="22" fill="#9AA6B2" text-anchor="middle" font-weight="400" direction="rtl">الشريحة: ◀ التالية  ▶ السابقة   ·   أثناء التسجيل: إيقاف مؤقت / إيقاف   ·   ⚑ علامة</text><g transform="translate(574 264.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><circle cx="0" cy="0" r="8" stroke="none" /></g><g transform="translate(414 264.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-8" width="26" height="18" rx="3" fill="none" /><circle cx="0" cy="1" r="5" fill="none" /><path d="M-7 -8 v-4 h10 v4" fill="none" /></g><g transform="translate(361 264.0)" fill="#E9EEF3" stroke="#E9EEF3" stroke-width="2" stroke-linejoin="round"><path d="M-10 -3 v-7 h7 M3 -10 h7 v7 M10 3 v7 H3 M-3 10 h-7 v-7" fill="none" /></g><